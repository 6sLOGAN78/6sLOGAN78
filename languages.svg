<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 260" width="100%">
  <defs>
    <style>
      .title { font-family: 'Orbitron', 'JetBrains Mono', monospace; font-weight: 800; font-size: 13px; fill: #ffffff; letter-spacing: 2px; }
      .subtitle { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: #71717a; letter-spacing: 1px; }
      .label { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: #fafafa; font-weight: 600; }
      .percent { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; fill: #a1a1aa; font-weight: 400; }
      .center-title { font-family: 'Orbitron', 'JetBrains Mono', monospace; font-size: 16px; fill: #ffffff; font-weight: 800; text-anchor: middle; }
      .center-sub { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 8px; fill: #71717a; text-anchor: middle; letter-spacing: 1px; }
      .bar-bg { fill: #18181b; rx: 3px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="650" height="260" rx="10" fill="#030303" stroke="#27272a" stroke-width="1.5" />
  <rect width="650" height="260" rx="10" fill="url(#grid)" />

  <g transform="translate(25, 30)">
    <text x="0" y="0" class="title">MOST USED LANGUAGES</text>
    <text x="0" y="16" class="subtitle">// TELEMETRY &amp; CODEBASE DISTRIBUTION</text>
    <line x1="0" y1="26" x2="600" y2="26" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <g transform="translate(0, 15)">
    <circle cx="150" cy="135" r="70" fill="none" stroke="#18181b" stroke-width="26" />
    <path d="M 150.00 65.00 A 70 70 0 0 1 184.16 196.10" fill="none" stroke="#ffffff" stroke-width="26" />
    <path d="M 184.16 196.10 A 70 70 0 0 1 114.45 195.30" fill="none" stroke="#d4d4d8" stroke-width="26" />
    <path d="M 114.45 195.30 A 70 70 0 0 1 80.26 141.07" fill="none" stroke="#a1a1aa" stroke-width="26" />
    <path d="M 80.26 141.07 A 70 70 0 0 1 97.98 88.16" fill="none" stroke="#71717a" stroke-width="26" />
    <path d="M 97.98 88.16 A 70 70 0 0 1 139.73 65.76" fill="none" stroke="#52525b" stroke-width="26" />
    <path d="M 139.73 65.76 A 70 70 0 0 1 150.00 65.00" fill="none" stroke="#3f3f46" stroke-width="26" />
    <circle cx="150" cy="135" r="54" fill="#030303" stroke="#27272a" stroke-width="1" />
    <text x="150" y="134" class="center-title">18</text>
    <text x="150" y="148" class="center-sub">PUBLIC REPOS</text>
  </g>

  <g transform="translate(280, 85)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#ffffff" />
      <text x="18" y="9" class="label">Python</text>
      <text x="280" y="9" class="percent" text-anchor="end">41.9%</text>
      <rect x="110" y="2" width="115" height="6" class="bar-bg" />
      <rect x="110" y="2" width="48.17" height="6" rx="3" fill="#ffffff" />
    </g>
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#d4d4d8" />
      <text x="18" y="9" class="label">C</text>
      <text x="280" y="9" class="percent" text-anchor="end">16.6%</text>
      <rect x="110" y="2" width="115" height="6" class="bar-bg" />
      <rect x="110" y="2" width="19.08" height="6" rx="3" fill="#d4d4d8" />
    </g>
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#a1a1aa" />
      <text x="18" y="9" class="label">TypeScript</text>
      <text x="280" y="9" class="percent" text-anchor="end">15.1%</text>
      <rect x="110" y="2" width="115" height="6" class="bar-bg" />
      <rect x="110" y="2" width="17.41" height="6" rx="3" fill="#a1a1aa" />
    </g>
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#71717a" />
      <text x="18" y="9" class="label">Go</text>
      <text x="280" y="9" class="percent" text-anchor="end">13.1%</text>
      <rect x="110" y="2" width="115" height="6" class="bar-bg" />
      <rect x="110" y="2" width="15.01" height="6" rx="3" fill="#71717a" />
    </g>
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#52525b" />
      <text x="18" y="9" class="label">JavaScript</text>
      <text x="280" y="9" class="percent" text-anchor="end">11.0%</text>
      <rect x="110" y="2" width="115" height="6" class="bar-bg" />
      <rect x="110" y="2" width="12.64" height="6" rx="3" fill="#52525b" />
    </g>
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#3f3f46" />
      <text x="18" y="9" class="label">Other</text>
      <text x="280" y="9" class="percent" text-anchor="end">2.3%</text>
      <rect x="110" y="2" width="115" height="6" class="bar-bg" />
      <rect x="110" y="2" width="2.69" height="6" rx="3" fill="#3f3f46" />
    </g>
  </g>

  <g transform="translate(25, 238)">
    <circle class="pulse" cx="4" cy="-4" r="3" fill="#ffffff" />
    <text x="14" y="-1" class="subtitle" style="font-size: 8px;">LIVE // AUTO-GENERATED DAILY FROM GITHUB API</text>
  </g>
</svg>
