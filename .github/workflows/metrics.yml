name: Metrics

on:

  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:

  github-metrics:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: lowlighter/metrics@latest

        with:

          token: ${{ secrets.GITHUB_TOKEN }}

          user: 6sLOGAN78

          template: classic

          config_theme: terminal

          config_timezone: Asia/Kolkata

          base: header, activity, community, repositories, metadata

          plugin_languages: yes

          plugin_languages_sections: most-used

          plugin_languages_limit: 10

          plugin_isocalendar: yes

          plugin_followup: yes

          plugin_habits: yes

          plugin_stars: yes

          extras_css: |
            svg {
              background: #030303 !important;
              --color-text: #fafafa !important;
              --color-border: rgba(255, 255, 255, 0.08) !important;
              --color-calendar-graph-day-bg: #09090b !important;
              --color-calendar-graph-day-L1: #161618 !important;
              --color-calendar-graph-day-L2: #242427 !important;
              --color-calendar-graph-day-L3: #3f3f46 !important;
              --color-calendar-graph-day-L4: #fafafa !important;
            }
            .graph { stroke: #fafafa !important; }
            .field, .title, h2, h2.field, h3, p, span, div, a, text {
              color: #fafafa !important;
              fill: #fafafa !important;
            }
