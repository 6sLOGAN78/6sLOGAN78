<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&amp;family=Orbitron:wght@400;700;900&amp;display=swap');
      .term-title { font-family: 'Orbitron', sans-serif; font-weight: 700; fill: #e4e4e7; letter-spacing: 2px; font-size: 11px; }
      .term-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #a1a1aa; }
      .term-accent { fill: #fafafa; font-weight: 700; }
      .term-dim { fill: #52525b; }
      .term-white { fill: #ffffff; }
      
      /* Blink Animation */
      .cursor { fill: #ffffff; animation: blink 1s step-end infinite; }
      @keyframes blink {
        50% { opacity: 0; }
      }
      
      /* HUD Rotation Animations */
      .hud-rotate-cw {
        transform-origin: 740px 160px;
        animation: rotate-cw 25s linear infinite;
      }
      .hud-rotate-ccw {
        transform-origin: 740px 160px;
        animation: rotate-ccw 20s linear infinite;
      }
      @keyframes rotate-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotate-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }

      /* Scanline Animation */
      .scanline {
        animation: scan 8s ease-in-out infinite;
        opacity: 0.08;
      }
      @keyframes scan {
        0% { transform: translateY(0); }
        50% { transform: translateY(276px); }
        100% { transform: translateY(0); }
      }

      /* Falling Code Animation */
      .falling-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #ffffff;
        opacity: 0;
        animation: fall 5s linear infinite;
      }
      @keyframes fall {
        0% { transform: translateY(-120px); opacity: 0; }
        10% { opacity: 0.08; }
        90% { opacity: 0.08; }
        100% { transform: translateY(300px); opacity: 0; }
      }

      .neon-border {
        stroke: rgba(255, 255, 255, 0.08);
      }
    </style>
    
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1"/>
    </pattern>

    <clipPath id="terminal-clip">
      <rect x="20" y="20" width="860" height="280" rx="8" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="8" fill="#030303" />
  <rect width="900" height="320" rx="8" fill="url(#grid)" />

  <!-- Glassmorphic panel -->
  <rect x="20" y="20" width="860" height="280" rx="8" fill="rgba(10, 10, 10, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" class="neon-border"/>

  <!-- Matrix Falling Code (Clipped) -->
  <g clip-path="url(#terminal-clip)">
    <text x="80" y="0" class="falling-code" style="animation-delay: 0s; animation-duration: 5.2s;">
      <tspan x="80" dy="12">1</tspan><tspan x="80" dy="12">0</tspan><tspan x="80" dy="12">5</tspan><tspan x="80" dy="12">F</tspan><tspan x="80" dy="12">A</tspan><tspan x="80" dy="12">0</tspan><tspan x="80" dy="12">9</tspan>
    </text>
    <text x="180" y="0" class="falling-code" style="animation-delay: 2.1s; animation-duration: 4.8s;">
      <tspan x="180" dy="12">0</tspan><tspan x="180" dy="12">1</tspan><tspan x="180" dy="12">B</tspan><tspan x="180" dy="12">C</tspan><tspan x="180" dy="12">8</tspan><tspan x="180" dy="12">2</tspan><tspan x="180" dy="12">7</tspan>
    </text>
    <text x="280" y="0" class="falling-code" style="animation-delay: 1s; animation-duration: 6s;">
      <tspan x="280" dy="12">E</tspan><tspan x="280" dy="12">D</tspan><tspan x="280" dy="12">9</tspan><tspan x="280" dy="12">0</tspan><tspan x="280" dy="12">F</tspan><tspan x="280" dy="12">3</tspan><tspan x="280" dy="12">1</tspan>
    </text>
    <text x="380" y="0" class="falling-code" style="animation-delay: 3.5s; animation-duration: 4.2s;">
      <tspan x="380" dy="12">C</tspan><tspan x="380" dy="12">O</tspan><tspan x="380" dy="12">R</tspan><tspan x="380" dy="12">E</tspan><tspan x="380" dy="12">8</tspan><tspan x="380" dy="12">A</tspan><tspan x="380" dy="12">9</tspan>
    </text>
    <text x="480" y="0" class="falling-code" style="animation-delay: 1.5s; animation-duration: 5.5s;">
      <tspan x="480" dy="12">7</tspan><tspan x="480" dy="12">2</tspan><tspan x="480" dy="12">X</tspan><tspan x="480" dy="12">D</tspan><tspan x="480" dy="12">0</tspan><tspan x="480" dy="12">B</tspan><tspan x="480" dy="12">5</tspan>
    </text>
    <text x="580" y="0" class="falling-code" style="animation-delay: 0.5s; animation-duration: 4.9s;">
      <tspan x="580" dy="12">3</tspan><tspan x="580" dy="12">9</tspan><tspan x="580" dy="12">E</tspan><tspan x="580" dy="12">F</tspan><tspan x="580" dy="12">1</tspan><tspan x="580" dy="12">0</tspan><tspan x="580" dy="12">4</tspan>
    </text>
    <text x="680" y="0" class="falling-code" style="animation-delay: 2.8s; animation-duration: 5.8s;">
      <tspan x="680" dy="12">A</tspan><tspan x="680" dy="12">C</tspan><tspan x="680" dy="12">9</tspan><tspan x="680" dy="12">2</tspan><tspan x="680" dy="12">0</tspan><tspan x="680" dy="12">7</tspan><tspan x="680" dy="12">1</tspan>
    </text>
    <text x="800" y="0" class="falling-code" style="animation-delay: 4s; animation-duration: 4.5s;">
      <tspan x="800" dy="12">E</tspan><tspan x="800" dy="12">4</tspan><tspan x="800" dy="12">B</tspan><tspan x="800" dy="12">F</tspan><tspan x="800" dy="12">D</tspan><tspan x="800" dy="12">0</tspan><tspan x="800" dy="12">2</tspan>
    </text>
  </g>

  <!-- Scanning Line (Clipped) -->
  <g clip-path="url(#terminal-clip)">
    <line x1="20" y1="20" x2="880" y2="20" stroke="#ffffff" stroke-width="2" class="scanline" />
  </g>

  <!-- Window Controls -->
  <circle cx="45" cy="45" r="4.5" fill="#1b1b1f" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="60" cy="45" r="4.5" fill="#2d2d34" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="75" cy="45" r="4.5" fill="#3f3f46" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="100" y="49" class="term-title">6sLOGAN78@MAURYA-OS: ~</text>

  <!-- ASCII Art Header -->
  <text x="45" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" xml:space="preserve" font-weight="700">
    <tspan x="45" dy="0">  __    ____  _      ___    ____    _    _   _ _____ ___  </tspan>
    <tspan x="45" dy="14"> / /_  / ___|| |    / _ \  / ___|  / \  | \ | |___  ( _ ) </tspan>
    <tspan x="45" dy="14">| '_ \ \___ \| |   | | | || |  _  / _ \ |  \| |  / / / _ \</tspan>
    <tspan x="45" dy="14">| (_) |____) | |___| |_| || |_| |/ ___ \| |\  | / / ( (_) )</tspan>
    <tspan x="45" dy="14"> \___/|____/ |____/ \___/  \____/_/   \_|_| \_|/_/   \___/ </tspan>
  </text>

  <!-- Terminal Lines -->
  <text x="45" y="195" class="term-text">
    <tspan x="45" dy="0">$ <tspan class="term-accent">init</tspan> --secure-connection --identity=6sLOGAN78</tspan>
    <tspan x="45" dy="18">&gt; ACCESS GRANTED. LOAD SEQUENCE: NOMINAL.</tspan>
    <tspan x="45" dy="18">&gt; CORES: <tspan class="term-accent">AI/ML</tspan> • <tspan class="term-accent">BACKEND DEVEL</tspan> • <tspan class="term-accent">ROBOTICS ENG</tspan></tspan>
    <tspan x="45" dy="18">&gt; TARGET STATUS: <tspan class="term-white">ACTIVE</tspan> // DECRYPTING CORE COMPONENTS <rect x="360" y="240" class="cursor" width="8" height="13" /></tspan>
  </text>

  <!-- HUD Decal -->
  <g transform="translate(740, 160)" opacity="0.35">
    <!-- Rotating Elements -->
    <circle r="60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="5 15" class="hud-rotate-cw"/>
    <circle r="50" fill="none" stroke="#ffffff" stroke-width="1" />
    <circle r="40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="10 5" class="hud-rotate-ccw"/>
    <circle r="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="40 10" class="hud-rotate-cw"/>
    
    <!-- Static Crosshairs -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#ffffff" stroke-width="0.5" />
    <line x1="-40" y1="-40" x2="40" y2="40" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="-40" y1="40" x2="40" y2="-40" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <text x="65" y="-5" font-family="'Orbitron', sans-serif" font-size="6" fill="#ffffff" letter-spacing="1">SEC_LOCK</text>
    <text x="-95" y="10" font-family="'Orbitron', sans-serif" font-size="6" fill="#ffffff" letter-spacing="1">SYS_ACTIVE</text>
  </g>
</svg>
